name: Release
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || github.event_name == 'push' && 'Cache warm-up (main)' || format('Test build {0}', inputs.version) }}

on:
  push:
    tags: ['v*']
    # A push to main runs the build job only to fill the Go cache that tag runs restore: a cache
    # is readable only from its own ref and the default branch, so caches saved by tag runs are
    # never read again. Building with the release steps themselves keeps the build cache keys
    # identical (fyne package --release compiles with -trimpath, -tags release and its own
    # CGO_CFLAGS, unlike go test). No artifacts, no release.
    branches: [main]
  # Test build without a tag: produces only the build artifacts of the run; the release job runs
  # only for tags.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version the test build carries (form v1.2.3 or v1.2.3-rc1)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: read
  # Read the CI workflow runs of the tagged commit (step "Check CI run").
  actions: read

env:
  # Release tag; for a test build without a tag, the version entered.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v0.0.0-main' }}
  # Part of the cache key: a new Fyne CLI may compile with other flags.
  FYNE_VERSION: v1.7.4
  # Only pushes to main save the Go cache; tag runs and test builds only restore it.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest # arm64
            goos: darwin
            goarch: arm64
            platform: macos-arm64
          - os: windows-latest # x64
            goos: windows
            goarch: amd64
            platform: windows-x64
          - os: ubuntu-22.04 # x64; old glibc, so that the AppImage runs on older distributions too
            goos: linux
            goarch: amd64
            platform: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check CI run
        # govulncheck, gofmt and go vet run in ci.yml for every pull request and every push to
        # main; they are not repeated here. A tag is built only if the CI workflow succeeded for
        # the tagged commit. A run still queued or in progress (tag pushed right after the
        # merge) is waited for, up to 20 minutes.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          api="repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100"
          for _ in $(seq 40); do
            ok=$(gh api "$api" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
            if [[ "$ok" -gt 0 ]]; then
              echo "CI succeeded for $SHA"
              exit 0
            fi
            pending=$(gh api "$api" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [[ "$pending" -eq 0 ]]; then
              echo "No successful CI run for $SHA; release aborted" >&2
              exit 1
            fi
            echo "CI run for $SHA still in progress, waiting"
            sleep 30
          done
          echo "CI run for $SHA did not finish within 20 minutes; release aborted" >&2
          exit 1
      - name: Check release notes
        # Final versions need hand-written release notes (see CLAUDE.md); if the file is
        # missing, the run stops before building. Release candidates (-rc) use the notes
        # GitHub generates. A test build without a tag publishes nothing.
        if: github.ref_type == 'tag'
        run: |
          if [[ "$TAG" != *-rc* ]] && [[ ! -s "release-notes/$TAG.md" ]]; then
            echo "release-notes/$TAG.md is missing or empty" >&2
            exit 1
          fi
      - uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: go.mod
          # The Go cache is handled by the steps below, setup-go cannot restore without saving.
          cache: false
      - name: Go cache key
        id: go-cache
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
          GO_SUM: ${{ hashFiles('go.sum') }}
        run: |
          {
            echo "key=go-release-${ImageOS}-${RUNNER_ARCH}-go${GO_VERSION}-fyne${FYNE_VERSION}-${GO_SUM}"
            echo "paths<<EOF"
            go env GOCACHE GOMODCACHE
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Go cache
        if: env.SAVE_CACHE != 'true'
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: ${{ steps.go-cache.outputs.paths }}
      - name: Restore and save Go cache (main)
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache@v6
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: ${{ steps.go-cache.outputs.paths }}
      - name: Install Fyne dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: go test
        # Stays on every platform: tests on real macOS and Windows have found failures the
        # Linux CI did not see.
        run: go test ./...

      - name: Determine and embed version
        run: |
          # Numeric part (macOS CFBundleShortVersionString, Windows file version):
          # tag v1.2.3-rc1 -> 1.2.3
          version="${TAG#v}"
          version="${version%%-*}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag $TAG does not give a valid version: $version" >&2
            exit 1
          fi
          echo "NUMERIC_VERSION=$version" >> "$GITHUB_ENV"
          # Embed the display version including the pre-release suffix (0.1.0-rc14) in the app,
          # see internal/ui/version.go
          printf '%s\n' "${TAG#v}" > internal/ui/VERSION
          mkdir -p dist

      - name: Build openlamt-mcp
        # The MCP server is a plain binary without Fyne and without cgo. It ships as its own
        # archive with LICENSE and NOTICE. The app's update check looks only for
        # OpenLAMT-<tag>-<platform> assets, so it never picks these.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          exe=openlamt-mcp
          [[ "$GOOS" == windows ]] && exe=openlamt-mcp.exe
          # Relative, so bash and PowerShell on Windows read the same path.
          stage=mcp-stage
          rm -rf "$stage"
          mkdir -p "$stage"
          go build -trimpath -ldflags "-s -w -X main.releaseVersion=$TAG" -o "$stage/$exe" ./cmd/openlamt-mcp
          cp LICENSE NOTICE "$stage/"
          # The runner's own platform: the binary starts and carries the tag.
          got=$("$stage/$exe" --version | tr -d '\r')
          echo "$got"
          if [[ "$got" != "openlamt-mcp $TAG" ]]; then
            echo "openlamt-mcp --version printed \"$got\", expected \"openlamt-mcp $TAG\"" >&2
            exit 1
          fi

      - name: Create openlamt-mcp archive (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="dist/openlamt-mcp-${TAG}-${PLATFORM}.tar.gz"
          tar -C mcp-stage -czf "$archive" openlamt-mcp LICENSE NOTICE
          tar -tzvf "$archive"

      - name: Create openlamt-mcp archive (Windows)
        if: runner.os == 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: |
          $archive = "dist/openlamt-mcp-$env:TAG-$env:PLATFORM.zip"
          Compress-Archive -Path mcp-stage/openlamt-mcp.exe, mcp-stage/LICENSE, mcp-stage/NOTICE -DestinationPath $archive
          Get-Item $archive

      - name: Install Fyne CLI
        if: runner.os != 'Linux'
        run: go install "fyne.io/tools/cmd/fyne@$FYNE_VERSION"

      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          fyne package --os darwin --src cmd/openlamt \
            --app-id io.github.srv02.openlamt --name OpenLAMT \
            --app-version "$NUMERIC_VERSION" --release
          test -d OpenLAMT.app

      - name: Ad-hoc signature (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - OpenLAMT.app
          codesign --verify --deep --strict OpenLAMT.app

      - name: Create disk image (macOS)
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The image shows OpenLAMT.app next to a shortcut to /Applications. ditto keeps the
          # signature, symlinks and extended attributes of the bundle.
          dmg="dist/OpenLAMT-${TAG}-${PLATFORM}.dmg"
          stage="$RUNNER_TEMP/dmg-root"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto OpenLAMT.app "$stage/OpenLAMT.app"
          ln -s /Applications "$stage/Applications"
          # hdiutil fails now and then with "Resource busy" on the runners.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname OpenLAMT -srcfolder "$stage" -format UDZO -ov "$dmg"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "hdiutil create failed five times" >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt), retrying" >&2
            sleep $((attempt * 5))
          done
          # Verify what users get: the image mounts, holds the shortcut and a valid signature.
          hdiutil verify "$dmg"
          mnt="$RUNNER_TEMP/dmg-mnt"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ok=1
          ls -la "$mnt"
          test -L "$mnt/Applications" || ok=0
          [[ "$(readlink "$mnt/Applications")" == /Applications ]] || ok=0
          codesign --verify --deep --strict "$mnt/OpenLAMT.app" || ok=0
          for attempt in 1 2 3 4 5; do
            hdiutil detach "$mnt" && break
            sleep 3
            [[ "$attempt" -eq 5 ]] && hdiutil detach -force "$mnt"
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "The disk image failed verification" >&2
            exit 1
          fi
      - name: Create archive (macOS)
        # Bridge release: versions up to v1.1.1 look only for the .zip. Dropped in the release
        # after the bridge release (issue #60).
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ditto -c -k --keepParent OpenLAMT.app "dist/OpenLAMT-${TAG}-${PLATFORM}.zip"

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          # Fyne needs cgo; the Windows runner ships MinGW gcc. --release builds without a console
          # window and embeds icon, version info and manifest. No code signature (SmartScreen
          # note in the README). Same method as rc17: executables built with go build and a
          # .syso (rc19) or patched afterwards with 14 icon sizes (rc18) triggered the SmartScreen
          # warning on download, this one did not.
          # Own 256 px icon: fyne embeds the image unchanged in the ICO, and Explorer shows no
          # icons above 256 px (cmd/openlamt/Icon.png has 1024 px and would stay blank there).
          # The path is relative to --src because fyne changes into it before loading the icon.
          fyne package --os windows --src cmd/openlamt --icon ../../packaging/windows/Icon.png \
            --app-id io.github.srv02.openlamt --name OpenLAMT \
            --app-version "$NUMERIC_VERSION" --release
          # For Windows, fyne changes into the --src directory and writes the executable there,
          # unlike macOS (.app in the working directory). Move it to the root.
          mv cmd/openlamt/OpenLAMT.exe OpenLAMT.exe
          test -f OpenLAMT.exe

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: Compress-Archive -Path OpenLAMT.exe -DestinationPath "dist/OpenLAMT-$env:TAG-$env:PLATFORM.zip"

      - name: Build Debian package (Linux)
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -ldflags '-s -w' -o openlamt ./cmd/openlamt
          packaging/linux/build-deb.sh openlamt "${TAG#v}" "dist/OpenLAMT-${TAG}-${PLATFORM}.deb"
          dpkg-deb -I "dist/OpenLAMT-${TAG}-${PLATFORM}.deb"
          dpkg-deb -c "dist/OpenLAMT-${TAG}-${PLATFORM}.deb"

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
          # Pinned: appimagetool 1.9.1 (2025-11-18), x86_64.
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          out="dist/OpenLAMT-${TAG}-${PLATFORM}.AppImage"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/linux/build-appimage.sh openlamt "$out"
          ls -l "$out"
          # The glibc the binary needs bounds the distributions it runs on.
          objdump -T openlamt | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          # Check the image: it unpacks and holds the files an AppImage needs.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$out" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/squashfs-root/AppRun"
          test -f "$RUNNER_TEMP/squashfs-root/openlamt.desktop"
          test -f "$RUNNER_TEMP/squashfs-root/openlamt.png"
          test -x "$RUNNER_TEMP/squashfs-root/usr/bin/openlamt"

      - uses: actions/upload-artifact@v7
        if: env.SAVE_CACHE != 'true'
        with:
          name: OpenLAMT-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: OpenLAMT-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$TAG" == *-rc* ]]; then
            flags+=(--prerelease --generate-notes)
          else
            flags+=(--notes-file "release-notes/$TAG.md")
          fi
          gh release create "$TAG" dist/* --verify-tag --title "OpenLAMT $TAG" "${flags[@]}"
